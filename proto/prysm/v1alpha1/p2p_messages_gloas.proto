syntax = "proto3";

package ethereum.eth.v1alpha1;

import "proto/eth/ext/options.proto";

option csharp_namespace = "Ethereum.Eth.V1alpha1";
option go_package = "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1;eth";
option java_multiple_files = true;
option java_outer_classname = "GloasP2PMessagesProto";
option java_package = "org.ethereum.eth.v1alpha1";
option php_namespace = "Ethereum\\Eth\\v1alpha1";

// =============================================================================
// Gloas Fork P2P RPC Messages
// =============================================================================
// This file defines the P2P RPC request/response message types introduced in
// the Gloas fork.
// Reference:
// https://github.com/ethereum/consensus-specs/blob/master/specs/gloas/p2p-interface.md

/*
 Spec Definition:
 ExecutionPayloadEnvelopesByRange v1
 (
   start_slot: Slot
   count: uint64
 )
*/
message ExecutionPayloadEnvelopesByRangeRequest {
  uint64 start_slot = 1 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  uint64 count = 2;
}

// ExecutionPayloadSegment carries one segment of a segmented execution payload
// envelope.
//
// Prysm-local: this is NOT a spec type, unlike the RPC messages above. The segment
// field is an opaque blob in the container/segments wire format, which carries its
// own version byte and descriptor. SSZ only frames it, so a segment can travel
// through the normal gossip pipeline (which decodes into a proto message) while the
// real format stays free to change without touching consensus types.
//
// ssz_max is the largest message container/segments can produce:
//   descriptor 50 + index 4 + proof count 1 + proof 448 (32 * ceil(log2 MaxSegments))
//   + data length 4 + data 1048576 (MaxSegmentSize) = 1049083
// segments.MaxSegmentMessageSize holds the same value and is asserted against this
// bound by a test, so the two cannot drift apart silently.
message ExecutionPayloadSegment {
  bytes segment = 1 [(ethereum.eth.ext.ssz_max) = "1049083"];
}
