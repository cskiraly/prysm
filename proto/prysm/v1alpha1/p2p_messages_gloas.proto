syntax = "proto3";

package ethereum.eth.v1alpha1;

import "proto/eth/ext/options.proto";

option csharp_namespace = "Ethereum.Eth.V1alpha1";
option go_package = "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1;eth";
option java_multiple_files = true;
option java_outer_classname = "GloasP2PMessagesProto";
option java_package = "org.ethereum.eth.v1alpha1";
option php_namespace = "Ethereum\\Eth\\v1alpha1";

// =============================================================================
// Gloas Fork P2P RPC Messages
// =============================================================================
// This file defines the P2P RPC request/response message types introduced in
// the Gloas fork.
// Reference:
// https://github.com/ethereum/consensus-specs/blob/master/specs/gloas/p2p-interface.md

/*
 Spec Definition:
 ExecutionPayloadEnvelopesByRange v1
 (
   start_slot: Slot
   count: uint64
 )
*/
message ExecutionPayloadEnvelopesByRangeRequest {
  uint64 start_slot = 1 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  uint64 count = 2;
}

// ExecutionPayloadSegment carries one segment of a segmented execution payload
// envelope.
//
// Prysm-local: this is NOT a spec type, unlike the RPC messages above; the feature it
// belongs to is flag-gated and the type changes with it. SSZ is the wire codec.
// container/segments converts to and from this type and bounds every field on the way
// in, so a decoded message that converts can be verified against its descriptor.
message ExecutionPayloadSegment {
  SegmentDescriptor segment_descriptor = 1;
  uint32 index = 2;
  // Sibling digests from the leaf to the root, at most ceil(log2 MaxSegments) = 14
  // (segments.MaxProofDepth).
  repeated bytes proof = 3 [
    (ethereum.eth.ext.ssz_size) = "?,32",
    (ethereum.eth.ext.ssz_max) = "14"
  ];
  // At most segments.MaxSegmentSize bytes.
  bytes data = 4 [(ethereum.eth.ext.ssz_max) = "1048576"];
}

// SegmentDescriptor is the authenticated header of a segmented message: every field that
// affects reassembly, so that pinning the first descriptor seen for a group is enough to
// reject peers that later contradict it. version and hash_id are bytes in
// container/segments and are rejected above 255.
message SegmentDescriptor {
  uint32 version = 1;
  uint32 hash_id = 2;
  uint32 count = 3;
  uint32 segment_size = 4;
  uint64 total_length = 5;
  bytes root = 6 [(ethereum.eth.ext.ssz_size) = "32"];
}
