name: SEACAST

# Builds the beacon node and the validator client with Go, and runs the SEACAST tests: the
# go-libp2p-pubsub fork in third_party/go-libp2p-pubsub, the segment packages, and the payload
# path. SEACAST's core, github.com/cskiraly/seacast-go, runs its own tests in its repository.
# Bazel builds upstream go-libp2p-pubsub rather than the fork (deps.bzl), so this branch builds
# and tests with Go only.

on:
  push:
    branches: [ seacast-devnet-clean ]
  pull_request:
    branches: [ seacast-devnet-clean ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_CFLAGS: "-O2 -D__BLST_PORTABLE__"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build the beacon node and the validator client
        run: go build -buildvcs=false ./cmd/beacon-chain ./cmd/validator

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            third_party/go-libp2p-pubsub/go.sum

      - name: The go-libp2p-pubsub fork
        working-directory: third_party/go-libp2p-pubsub
        # Two of upstream's discovery tests hang now and then in this fork's suite (cause not found).
        run: go test -count=1 -timeout 10m -skip '^(TestSimpleDiscovery|TestGossipSubDiscoveryAfterBootstrap)$' .

      - name: The segment packages
        run: go test -count=1 -timeout 10m ./beacon-chain/p2p/internal/segmentgossip/ ./container/segments/ ./beacon-chain/p2p/testing/ ./beacon-chain/p2p/segmentintegrationtest/

      - name: The p2p and sync packages' SEACAST tests
        run: |
          go test -count=1 -timeout 10m ./beacon-chain/p2p/ -run 'Seacast|Segment|PayloadType'
          go test -count=1 -timeout 10m ./beacon-chain/sync/ -run 'Segment|Envelope'

      - name: The payload path, five runs
        run: go test -count=5 -timeout 10m ./beacon-chain/p2p/segmentintegrationtest/ -run '^TestSeacastPayloadPath$'
